<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>FatBoy</title>
<style>
/* ==========================================================================
   FatBoy
   Layout: one column (max 560px). Glass navigation bar on top, floating glass
   tab bar at the bottom, solid grouped surfaces in between.
   Theme and motion arrive as data attributes on <html> (see effects.js):
   data-theme="dark|light" and data-motion="full|reduced".
   ========================================================================== */

/* --- Tokens ---------------------------------------------------------------- */
:root {
  /* Surfaces: 0 page, 1 cards, 2 inputs and tonal fills, 3 pressed */
  --bg: #0b0c0f;
  --surface-1: #14161b;
  --surface-2: #1c1f26;
  --surface-3: #262a33;
  --outline: #2b2f39;

  --on-surface: #f2f4f8;
  --on-surface-2: #a3aab8;

  /* Roles */
  --primary: #0f6bfa;
  --primary-hover: #0b5ce0;
  --primary-press: #0a52c8;
  --on-primary: #ffffff;
  --accent: #4da3ff;          /* blue used for text, rings and fills on dark */
  --on-accent: #0b0c0f;
  --tonal: #0f2a52;
  --tonal-hover: #14346a;
  --tonal-press: #193f80;
  --on-tonal: #a8ccff;
  --sky: #64d2ff;

  /* Status */
  --success: #3ddc84;
  --success-container: #11301f;
  --on-success: #b9f3d0;
  --error: #ff6b63;
  --error-container: #3a1613;
  --on-error: #ffd0cc;

  /* Glass */
  --glass: rgba(28, 31, 38, 0.62);
  --glass-strong: rgba(24, 27, 33, 0.82);
  --glass-active: rgba(255, 255, 255, 0.12);
  --glass-edge: rgba(255, 255, 255, 0.14);
  --glass-highlight: rgba(255, 255, 255, 0.22);
  --scrim: rgba(0, 0, 0, 0.55);
  --lift: 0 4px 12px rgba(0, 0, 0, 0.32);

  /* Raised pieces (Learn and Quests): a flat face plus a solid edge below it */
  --shine: rgba(255, 255, 255, 0.2);
  --edge-surface: #2a2e38;
  --edge-primary: #0a3f94;
  --edge-tonal: #0a1d3b;
  --edge-accent: #2b78cf;


  /* Type */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-display: 48px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-body: 16px;
  --fs-small: 14px;
  --fs-tiny: 12px;

  /* Space, radius, motion */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-12: 48px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-xl: 32px;
  --r-pill: 999px;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --t-micro: 150ms;
  --t-screen: 300ms;

  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #f2f4f8;
  --surface-1: #ffffff;
  --surface-2: #e9ecf2;
  --surface-3: #dde1ea;
  --outline: #d5d9e2;
  --on-surface: #0b0c0f;
  --on-surface-2: #4b5262;
  --primary: #0a5cdb;
  --primary-hover: #084fc0;
  --primary-press: #07449f;
  --accent: #0a5cd6;
  --on-accent: #ffffff;
  --tonal: #dce9ff;
  --tonal-hover: #cfe0ff;
  --tonal-press: #bcd4ff;
  --on-tonal: #0b3a86;
  --sky: #0b7aa8;
  --success: #1b7a3c;
  --success-container: #dcf5e4;
  --on-success: #0f4a23;
  --error: #c4281c;
  --error-container: #fde4e1;
  --on-error: #7a1610;
  --glass: rgba(255, 255, 255, 0.66);
  --glass-strong: rgba(255, 255, 255, 0.86);
  --glass-active: rgba(10, 92, 214, 0.12);
  --glass-edge: rgba(255, 255, 255, 0.7);
  --glass-highlight: rgba(255, 255, 255, 0.95);
  --scrim: rgba(11, 12, 15, 0.4);
  --lift: 0 4px 12px rgba(11, 12, 15, 0.08);
  --shine: rgba(255, 255, 255, 0.55);
  --edge-surface: #c6cddb;
  --edge-primary: #06358a;
  --edge-tonal: #a8c2f0;
  --edge-accent: #063a8c;
  color-scheme: light;
}

/* --- Base ------------------------------------------------------------------ */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--on-surface);
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

h1 { font-size: var(--fs-h1); line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: var(--fs-h2); line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h3 { font-size: var(--fs-body); line-height: 1.4; font-weight: 600; }
.display { font-size: var(--fs-display); line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; }
.caption { font-size: var(--fs-small); line-height: 1.4; color: var(--on-surface-2); }
.num { font-variant-numeric: tabular-nums; }
.measure { max-width: 65ch; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.icon {
  width: 24px;
  height: 24px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.icon.is-solid { fill: currentColor; }

/* --- Layout helpers --------------------------------------------------------- */
.container { max-width: 560px; margin-inline: auto; padding-inline: var(--sp-4); }
.page { display: flex; flex-direction: column; gap: var(--sp-6); padding-block: var(--sp-6) 128px; }
.stack { display: flex; flex-direction: column; gap: var(--sp-4); min-width: 0; }
.stack-tight { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
.row { display: flex; align-items: center; gap: var(--sp-4); min-width: 0; }
.row-wrap { flex-wrap: wrap; }
.row-tight { gap: var(--sp-2); }
.grow { flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); text-align: center; }
.center { text-align: center; align-items: center; }
.page-title { display: flex; flex-direction: column; gap: var(--sp-1); }
.fill { width: 100%; }
.is-over { color: var(--error); font-weight: 600; }

/* --- Surfaces --------------------------------------------------------------- */
.card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  min-width: 0;
  padding: var(--sp-6);
  background: var(--surface-1);
  border: 1px solid var(--outline);
  border-radius: var(--r-lg);
}

.list {
  background: var(--surface-1);
  border: 1px solid var(--outline);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.list-row {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  min-height: 56px;
  padding: var(--sp-2) var(--sp-6);
  border-top: 1px solid var(--outline);
}
.list-row:first-child { border-top: 0; }

.tile {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  padding: var(--sp-6);
  background: var(--surface-1);
  border: 1px solid var(--outline);
  border-radius: var(--r-lg);
  min-width: 0;
}

/* Cards and tiles that are buttons */
button.tile,
button.card {
  width: 100%;
  color: inherit;
  text-align: left;
  transition: background var(--t-micro) ease-out, transform 100ms ease-out;
}
button.tile:hover, button.card:hover { background: var(--surface-2); }
button.tile:active, button.card:active { background: var(--surface-3); transform: scale(0.99); }
.nav-card { flex-direction: row; align-items: center; }

/* Glass is reserved for floating chrome: toolbar, tab bar, sheets, dock, toast */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow:
    inset 0 1px 0 var(--glass-highlight),
    inset 0 0 0 1px var(--glass-edge),
    var(--lift);
}

/* --- Buttons ---------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: 48px;
  padding: var(--sp-3) var(--sp-6);
  border: 0;
  border-radius: var(--r-pill);
  background: var(--primary);
  color: var(--on-primary);
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  transition: background var(--t-micro) ease-out, transform 100ms ease-out;
}
.btn:hover { background: var(--primary-hover); }
.btn:active { background: var(--primary-press); transform: scale(0.98); }
.btn-large { min-height: 56px; width: 100%; }
.btn-tonal { background: var(--tonal); color: var(--on-tonal); }
.btn-tonal:hover { background: var(--tonal-hover); }
.btn-tonal:active { background: var(--tonal-press); }
.btn-plain { background: transparent; color: var(--accent); }
.btn-plain:hover { background: var(--tonal); }
.btn-plain:active { background: var(--tonal-hover); }
.btn-danger { color: var(--error); }
.btn-danger:hover { background: var(--error-container); }
.btn-small { min-height: 48px; padding: var(--sp-2) var(--sp-4); font-size: var(--fs-small); font-weight: 500; }
.btn:disabled,
.btn[aria-disabled="true"] {
  background: var(--surface-2);
  color: var(--on-surface-2);
  cursor: not-allowed;
  transform: none;
}
.btn-plain:disabled { background: transparent; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: var(--r-pill);
  background: transparent;
  color: var(--on-surface-2);
  transition: background var(--t-micro) ease-out;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { background: var(--surface-3); }
.icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* --- Forms ------------------------------------------------------------------ */
.field { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
.field > label,
.field-label { font-size: var(--fs-small); font-weight: 600; line-height: 1.4; }

.input {
  width: 100%;
  min-height: 48px;
  padding: var(--sp-3) var(--sp-4);
  border: 0;
  border-radius: var(--r-md);
  background: var(--surface-2);
  color: var(--on-surface);
  box-shadow: inset 0 0 0 1px transparent;
  transition: box-shadow var(--t-micro) ease-out, background var(--t-micro) ease-out;
}
.input::placeholder { color: var(--on-surface-2); opacity: 0.8; }
.input:hover { background: var(--surface-3); }
.input:focus { outline: none; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--accent); }
.input[aria-invalid="true"] { box-shadow: inset 0 0 0 2px var(--error); }
.input:disabled { opacity: 0.5; cursor: not-allowed; }

.error {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-2);
  color: var(--error);
  font-size: var(--fs-small);
  font-weight: 600;
  line-height: 1.4;
}
.error .icon { width: 16px; height: 16px; margin-top: 2px; }

.segmented { display: flex; gap: var(--sp-1); padding: var(--sp-1); border-radius: var(--r-pill); background: var(--surface-2); }
.segmented button {
  flex: 1;
  min-height: 44px;
  min-width: 48px;
  padding: var(--sp-1) var(--sp-3);
  border: 0;
  border-radius: var(--r-pill);
  background: transparent;
  color: var(--on-surface-2);
  font-size: var(--fs-small);
  font-weight: 600;
  line-height: 1.25;
  transition: background var(--t-micro) ease-out, color var(--t-micro) ease-out, box-shadow var(--t-micro) ease-out;
}
.segmented button:hover { background: var(--surface-3); }
.segmented button[aria-selected="true"],
.segmented button[aria-checked="true"] { background: var(--surface-1); color: var(--on-surface); box-shadow: var(--lift); }

/* Range slider (figure preview) */
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 48px; margin: 0; background: transparent; cursor: pointer; }
.range::-webkit-slider-runnable-track { height: 8px; border-radius: var(--r-pill); background: var(--surface-3); }
.range::-moz-range-track { height: 8px; border-radius: var(--r-pill); background: var(--surface-3); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border: 3px solid var(--surface-1); border-radius: 50%; background: var(--accent); box-shadow: var(--lift); }
.range::-moz-range-thumb { width: 22px; height: 22px; border: 3px solid var(--surface-1); border-radius: 50%; background: var(--accent); box-shadow: var(--lift); }
.scrub { text-align: left; }

/* Selectable answers and option cards */
.choice {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  width: 100%;
  min-height: 64px;
  padding: var(--sp-4) var(--sp-6);
  border: 1px solid var(--outline);
  border-radius: var(--r-md);
  background: var(--surface-1);
  color: var(--on-surface);
  font-weight: 600;
  text-align: left;
  transition: background var(--t-micro) ease-out, box-shadow var(--t-micro) ease-out, transform 100ms ease-out;
}
.choice:hover { background: var(--surface-2); }
.choice:active { background: var(--surface-3); transform: scale(0.99); }
.choice[aria-pressed="true"],
.choice[aria-checked="true"] { background: var(--tonal); color: var(--on-tonal); box-shadow: inset 0 0 0 2px var(--accent); }
.choice.is-right { background: var(--success-container); color: var(--on-success); box-shadow: inset 0 0 0 2px var(--success); }
.choice.is-wrong { background: var(--error-container); color: var(--on-error); box-shadow: inset 0 0 0 2px var(--error); }
.choice:disabled { cursor: default; transform: none; }
.choice .label { min-width: 0; overflow-wrap: anywhere; }
.choice > .icon:last-child:not(:first-child) { margin-left: auto; }

/* --- Meters ------------------------------------------------------------------ */
/* Every meter is driven by --v (0 to 1) so it can transition between repaints. */
.bar { height: 8px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; width: calc(var(--v, 0) * 100%); height: 100%; border-radius: var(--r-pill); background: var(--accent); transition: width 350ms var(--ease-out); }

.ring-track { fill: none; stroke: var(--surface-3); stroke-width: 16; }
.ring-fill {
  fill: none;
  stroke-width: 16;
  stroke-linecap: round;
  stroke-dasharray: var(--len);
  stroke-dashoffset: calc(var(--len) * (1 - var(--v, 0)));
  transition: stroke-dashoffset 450ms var(--ease-out);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  min-height: 24px;
  padding: 0 var(--sp-3);
  border-radius: var(--r-pill);
  background: var(--surface-2);
  color: var(--on-surface-2);
  font-size: var(--fs-tiny);
  font-weight: 600;
  white-space: nowrap;
}
.pill.is-tonal { background: var(--tonal); color: var(--on-tonal); }
.pill .icon { width: 16px; height: 16px; }

.glyph {
  display: grid;
  place-items: center;
  flex: none;
  width: 48px;
  height: 48px;
  border-radius: var(--r-md);
  background: var(--tonal);
  color: var(--on-tonal);
}
.glyph.is-off { background: var(--surface-2); color: var(--on-surface-2); }
.glyph-lg { width: 72px; height: 72px; border-radius: var(--r-lg); }
.glyph-lg .icon { width: 32px; height: 32px; }

/* --- The figure (the logo, which slims as weight comes off) ------------------ */
.figure {
  display: block;
  flex: none;
  color: var(--on-surface);
  fill: currentColor;
  fill-rule: evenodd;
  stroke: currentColor;
  stroke-width: 0.6px;
  stroke-linejoin: round;
}
.figure-sm { width: 96px; height: 96px; }
.figure-md { width: 160px; height: 160px; }
.figure-lg { width: min(100%, 240px); height: auto; aspect-ratio: 1; }
.figure-hero { width: min(100%, 280px); height: auto; aspect-ratio: 1; }
.figure-row { display: flex; align-items: center; gap: var(--sp-4); }

.logo {
  display: inline-block;
  flex: none;
  padding: 3px;
  background: var(--surface-1);
  border: 1px solid var(--outline);
  line-height: 0;
}
.logo .figure { width: 100%; height: 100%; stroke-width: 1.4px; }

/* --- Navigation chrome ------------------------------------------------------- */
#toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.toolbar { border-radius: 0; box-shadow: inset 0 -1px 0 var(--glass-edge); }
.toolbar-inner { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); padding-block: var(--sp-2); }
.brand { display: flex; align-items: center; gap: var(--sp-3); font-weight: 800; font-size: var(--fs-h2); letter-spacing: -0.02em; line-height: 1.3; }
.stats { display: flex; align-items: center; }
.stat {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  min-width: 48px;
  min-height: 48px;
  padding: 0 var(--sp-3);
  border: 0;
  border-radius: var(--r-pill);
  background: transparent;
  font-weight: 700;
  transition: background var(--t-micro) ease-out;
}
.stat:hover { background: var(--glass-active); }
.stat:active { background: var(--glass-edge); }
.stat-streak .icon { color: var(--sky); }
.stat-gems .icon { color: var(--accent); }
.stat-hearts .icon { color: var(--error); }

/* Floating glass tab bar; a pill slides under the current tab. */
.tabbar {
  position: fixed;
  left: 50%;
  bottom: calc(var(--sp-4) + env(safe-area-inset-bottom, 0px));
  z-index: 6;
  width: min(calc(100% - 32px), 528px);
  transform: translateX(-50%);
  padding: var(--sp-2);
  border-radius: var(--r-xl);
}
.tabbar ul { position: relative; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--sp-1); }

.tab-pill {
  position: absolute;
  inset: 0 auto 0 0;
  width: calc((100% - 4 * var(--sp-1)) / 5);
  border-radius: var(--r-lg);
  background: var(--glass-active);
  transform: translateX(calc(var(--i, 0) * (100% + var(--sp-1))));
  transition: transform var(--t-screen) var(--ease-out);
}

.tab {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-1);
  width: 100%;
  min-height: 56px;
  padding: 0;
  border: 0;
  border-radius: var(--r-lg);
  background: transparent;
  color: var(--on-surface-2);
  font-size: var(--fs-tiny);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.01em;
  transition: color var(--t-micro) ease-out;
}
.tab:hover { color: var(--on-surface); }
.tab[aria-current="page"] { color: var(--accent); }

/* --- Learn: the lesson path -------------------------------------------------- */
/* Lessons sit on a rail as raised tiles, labels alternating left and right. */
.path { display: flex; flex-direction: column; padding-top: var(--sp-2); }
.step {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr);
  align-items: center;
  column-gap: var(--sp-4);
  width: 100%;
  padding: 0 0 var(--sp-8);
  border: 0;
  border-radius: var(--r-md);
  background: transparent;
  color: inherit;
  text-align: left;
}
.step:last-child { padding-bottom: var(--sp-2); }
.step[aria-disabled="true"] { cursor: default; }
.step-text { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1); grid-row: 1; min-width: 0; }
.step.is-left .step-text { grid-column: 1; align-items: flex-end; text-align: right; }
.step.is-right .step-text { grid-column: 3; }
.step-title { font-weight: 600; overflow-wrap: anywhere; }
.is-locked .step-title { color: var(--on-surface-2); }

.step:not(:last-child)::after {
  content: "";
  position: absolute;
  left: calc(50% - 3px);
  top: 84px;
  width: 6px;
  height: 20px;
  border-radius: var(--r-pill);
  background: var(--outline);
}
.step.is-done:not(:last-child)::after { background: var(--accent); }

.node {
  --d: 8px;
  --y: 0px;
  --face: var(--surface-3);
  --edge: var(--edge-surface);
  --ink: var(--on-surface-2);
  grid-column: 2;
  grid-row: 1;
  display: grid;
  place-items: center;
  width: 72px;
  height: 72px;
  border-radius: var(--r-lg);
  background: var(--face);
  color: var(--ink);
  box-shadow: inset 0 3px 0 var(--shine), 0 var(--d) 0 var(--edge);
  transform: perspective(360px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--y));
  transition: transform 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
}
.node .icon { width: 32px; height: 32px; }
.is-done .node { --face: var(--accent); --edge: var(--edge-accent); --ink: var(--on-accent); }
.is-current .node { --face: var(--primary); --edge: var(--edge-primary); --ink: var(--on-primary); animation: bob 2.4s ease-in-out infinite; }
.is-locked .node { box-shadow: inset 0 2px 0 var(--shine), 0 var(--d) 0 var(--edge); }

.step:hover .node { --d: 11px; --y: -3px; }
.step:active .node { --d: 2px; --y: 6px; animation: none; }
.step[aria-disabled="true"]:hover .node { --d: 8px; --y: 0px; }
.step[aria-disabled="true"]:active .node { --d: 5px; --y: 3px; }

/* --- Track ------------------------------------------------------------------- */
.rings { width: 200px; height: 200px; margin-inline: auto; transform: rotate(-90deg); }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }

.glasses { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-3); }
.cup {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-1);
  min-height: 80px;
  border: 0;
  border-radius: var(--r-md);
  background: var(--surface-2);
  color: var(--on-surface-2);
  font-size: var(--fs-tiny);
  font-weight: 600;
  transition: background var(--t-micro) ease-out, color var(--t-micro) ease-out, transform 100ms ease-out;
}
.cup:active { transform: scale(0.96); }
.cup .icon { width: 32px; height: 32px; }
.cup:hover { background: var(--surface-3); }
.cup[aria-pressed="true"] { background: var(--tonal); color: var(--on-tonal); }
.cup[aria-pressed="true"] .icon { fill: var(--sky); stroke: var(--sky); }

.chart text { fill: var(--on-surface-2); font-size: 12px; font-family: var(--font); }
.chart .grid { stroke: var(--outline); stroke-width: 1; }
.chart .line { stroke: var(--accent); stroke-width: 3; fill: none; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; }
.chart .goal { stroke: var(--sky); stroke-width: 2; stroke-dasharray: 8 8; }
.chart .dot { fill: var(--surface-1); stroke: var(--accent); stroke-width: 3; }
.scroll-x { overflow-x: auto; }
.chart { width: 100%; min-width: 288px; height: auto; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--sp-2); text-align: center; }
.node-day {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  margin-inline: auto;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--on-surface-2);
}
.node-day .icon { width: 20px; height: 20px; }
.node-day.is-active { background: var(--tonal); color: var(--sky); }
.node-day.is-frozen { background: var(--tonal); color: var(--accent); }
.node-day.is-today { box-shadow: inset 0 0 0 2px var(--accent); }

.mini-ring { position: relative; display: grid; place-items: center; flex: none; width: 64px; height: 64px; color: var(--accent); }
.mini-ring > svg:first-child { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.mini-ring .ring-track, .mini-ring .ring-fill { stroke-width: 6; }

/* --- Quests ------------------------------------------------------------------ */
.board { display: grid; gap: var(--sp-4); }

/* A two-sided card: the back faces out until the quest is turned over. */
.qcard { perspective: 1200px; }
.qcard-inner { display: grid; transform-style: preserve-3d; transition: transform 350ms var(--ease-out); }
.qcard.is-flipped .qcard-inner { transform: rotateY(180deg); }
.qface {
  grid-area: 1 / 1;
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  min-width: 0;
  padding: var(--sp-6);
  border: 1px solid var(--outline);
  border-radius: var(--r-lg);
  background: var(--surface-1);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
.qfront { transform: rotateY(180deg); }
.qback {
  flex-direction: row;
  align-items: center;
  background: var(--tonal);
  color: var(--on-tonal);
  text-align: left;
  transition: background var(--t-micro) ease-out;
}
.qback:hover { background: var(--tonal-hover); }
.qback:active { background: var(--tonal-press); }
.qback .caption { color: var(--on-tonal); }
.qback .pill { background: var(--surface-1); color: var(--on-surface); }
.qback .pips { margin-top: var(--sp-1); }
.qmark { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--surface-1); color: var(--accent); }
.qtier { font-size: var(--fs-h2); font-weight: 700; line-height: 1.3; }
.pips { display: inline-flex; gap: var(--sp-1); }
.pips i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 2px currentColor; }
.pips i.on { background: currentColor; }

.stamp {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  align-self: flex-start;
  min-height: 48px;
  padding: 0 var(--sp-4);
  border-radius: var(--r-pill);
  background: var(--success-container);
  color: var(--on-success);
  font-weight: 600;
}

.chest { align-items: center; text-align: center; }
.chest-art { width: 160px; height: auto; }
.chest-body { fill: var(--surface-3); stroke: var(--accent); stroke-width: 3; }
.chest-lid { fill: var(--tonal); stroke: var(--accent); stroke-width: 3; transform-origin: 16px 46px; transition: transform 400ms var(--ease-out); }
.chest-lock { fill: var(--accent); }
.chest-loot circle { fill: var(--sky); }
.chest-loot { opacity: 0; transition: opacity 250ms ease-out 150ms, transform 400ms var(--ease-out) 150ms; }
.chest.is-locked .chest-art { opacity: 0.55; }
.chest.is-opening .chest-lid, .chest.is-open .chest-lid { transform: rotate(-32deg); }
.chest.is-opening .chest-loot, .chest.is-open .chest-loot { opacity: 1; transform: translateY(-14px); }

.badge-tile { align-items: flex-start; }

/* --- Raised pieces ------------------------------------------------------------- */
/* On Learn and Quests, surfaces are slabs: a flat face and a solid edge beneath it.
   Hovering lifts a slab, pressing pushes it flat. Pointer tilt comes from app.js. */
.is-3d .card,
.is-3d .tile,
.is-3d .qface {
  --d: 6px;
  --y: 0px;
  box-shadow: 0 var(--d) 0 var(--edge-surface);
}
.is-3d .page-title + .card,
.is-3d .tile { margin-bottom: 0; }

.is-3d .btn:not(.btn-plain) {
  --d: 4px;
  --y: 0px;
  box-shadow: inset 0 2px 0 var(--shine), 0 var(--d) 0 var(--edge-primary);
  transform: translateY(var(--y));
  transition: background var(--t-micro) ease-out, transform 100ms ease-out, box-shadow 100ms ease-out;
}
.is-3d .btn-tonal { box-shadow: inset 0 2px 0 var(--shine), 0 var(--d) 0 var(--edge-tonal); }
.is-3d .btn:not(.btn-plain):hover { --d: 5px; --y: -1px; }
.is-3d .btn:not(.btn-plain):active { --d: 0px; --y: 4px; transform: translateY(var(--y)); }
.is-3d .btn:disabled,
.is-3d .btn[aria-disabled="true"] { box-shadow: inset 0 0 0 1px var(--outline); transform: none; }

.is-3d .glyph { box-shadow: inset 0 2px 0 var(--shine), 0 3px 0 var(--edge-tonal); }
.is-3d .glyph.is-off { box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.18); }

.is-3d .bar { height: 14px; background: var(--surface-3); box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.25); }
.is-3d .bar > i { box-shadow: inset 0 2px 0 var(--shine), inset 0 -3px 0 var(--edge-accent); }

/* Quest cards: the face tilts and presses; turning one over lifts it first. */
.is-3d .qback {
  background: var(--tonal);
  box-shadow: inset 0 2px 0 var(--shine), 0 var(--d) 0 var(--edge-tonal);
  transform: perspective(720px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--y));
  transition: background var(--t-micro) ease-out, transform 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
}
.is-3d .qback:hover { --d: 9px; --y: -3px; }
.is-3d .qback:active { --d: 2px; --y: 4px; }
.is-3d .qmark { box-shadow: inset 0 2px 0 var(--shine), 0 3px 0 var(--edge-surface); }
.qcard.is-turning { animation: lift 350ms var(--ease-out); }

/* Chest: a solid base under the body gives it thickness */
.chest-edge { fill: var(--edge-surface); }
.chest.is-ready .chest-art { animation: rock 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
.chest-stage { display: grid; place-items: center; transform: perspective(500px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 150ms var(--ease-out); }

/* Badges: earned ones stand proud, the rest are pressed in */
.is-3d .badge-tile { transition: background var(--t-micro) ease-out, transform 100ms ease-out, box-shadow 100ms ease-out; }
.is-3d .badge-tile.is-locked { background: var(--surface-2); border-color: transparent; box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.18); }
.is-3d .badge-tile.is-earned:hover { --d: 9px; transform: translateY(-3px); }
.is-3d .badge-tile:active { --d: 2px; transform: translateY(4px); }
.is-3d .badge-tile.is-locked:active { transform: none; }

/* Week days: coins that are raised once the day counted */
.is-3d .node-day { box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.18); }
.is-3d .node-day.is-active,
.is-3d .node-day.is-frozen { box-shadow: inset 0 2px 0 var(--shine), 0 3px 0 var(--edge-tonal); }
.is-3d .node-day.is-today { box-shadow: inset 0 0 0 2px var(--accent), 0 3px 0 var(--edge-tonal); }

/* --- Onboarding ---------------------------------------------------------------- */
.option-grid { display: flex; flex-direction: column; gap: var(--sp-2); }
.hero { display: flex; flex-direction: column; align-items: center; gap: var(--sp-6); max-width: 480px; margin-inline: auto; padding-block: var(--sp-6) var(--sp-8); text-align: center; }
.hero .caption { max-width: 45ch; }
.hero-language { width: 100%; text-align: left; }

/* --- Overlays ------------------------------------------------------------------ */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.sheet {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  width: calc(100% - 16px);
  max-width: 544px;
  max-height: calc(100% - 48px);
  margin-bottom: calc(var(--sp-2) + env(safe-area-inset-bottom, 0px));
  padding: var(--sp-6);
  overflow: auto;
  border-radius: var(--r-xl);
  background: var(--glass-strong);
}
.grabber { width: 48px; height: 4px; margin: calc(var(--sp-2) * -1) auto 0; border-radius: 2px; background: var(--on-surface-2); opacity: 0.4; }

.lesson {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--bg);
}
.lesson-bar { display: flex; align-items: center; gap: var(--sp-4); width: 100%; max-width: 560px; margin-inline: auto; padding: var(--sp-2) var(--sp-4); }
.lesson-body { flex: 1; width: 100%; max-width: 560px; margin-inline: auto; padding: var(--sp-6) var(--sp-4); overflow: auto; display: flex; flex-direction: column; gap: var(--sp-6); }
.lesson-body.is-centered { justify-content: center; align-items: center; text-align: center; }
.question { font-size: var(--fs-h2); line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.dock {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  width: calc(100% - 32px);
  max-width: 528px;
  margin: 0 auto calc(var(--sp-4) + env(safe-area-inset-bottom, 0px));
  padding: var(--sp-4);
  border-radius: var(--r-xl);
}
.feedback { display: flex; align-items: flex-start; gap: var(--sp-4); padding-inline: var(--sp-2); }
.feedback .badge { display: grid; place-items: center; width: 48px; height: 48px; flex: none; border-radius: 50%; }
.feedback.is-right .badge { background: var(--success-container); color: var(--success); }
.feedback.is-wrong .badge { background: var(--error-container); color: var(--error); }
.match { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
.match .choice { justify-content: center; text-align: center; padding: var(--sp-3) var(--sp-4); }
.match .choice .icon { margin: 0; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(104px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  max-width: calc(100% - 32px);
  padding: var(--sp-3) var(--sp-6);
  transform: translateX(-50%);
  border-radius: var(--r-pill);
  font-size: var(--fs-small);
  font-weight: 600;
  line-height: 1.4;
  text-align: center;
}
.toast[hidden] { display: none; }

#fx { position: fixed; inset: 0; z-index: 60; overflow: hidden; pointer-events: none; }
.confetti { position: absolute; width: 8px; height: 12px; border-radius: 2px; }

/* --- Motion ------------------------------------------------------------------- */
/* Screens: content rises in block by block. Micro feedback: 100 to 200ms. */
.is-entering > * { animation: rise-in var(--t-screen) var(--ease-out) both; animation-delay: calc(var(--n, 0) * 40ms); }
.lesson.is-entering { animation: scale-in var(--t-screen) var(--ease-out); }
.lesson-body.is-sliding { animation: slide-in var(--t-screen) var(--ease-out); }
.lesson .feedback { animation: rise-in 250ms var(--ease-out); }
.lesson .result > * { animation: rise-in var(--t-screen) var(--ease-out) both; }
.lesson .result > :nth-child(2) { animation-delay: 60ms; }
.lesson .result > :nth-child(3) { animation-delay: 120ms; }
.lesson .result > :nth-child(4) { animation-delay: 180ms; }
.lesson .result > :nth-child(5) { animation-delay: 240ms; }
.sheet { animation: rise-in var(--t-screen) var(--ease-out); }
.scrim { animation: fade-in 200ms ease-out; }
.scrim.is-closing { animation: fade-out 160ms ease-in forwards; }
.scrim.is-closing .sheet { animation: sink 160ms ease-in forwards; }
.toast:not([hidden]) { animation: toast-in 200ms var(--ease-out); }
.choice.pop { animation: pop 250ms var(--ease-out); }
.shake { animation: shake 250ms ease-out; }
.stat-hearts.is-hit .icon { animation: hit 350ms ease-out; }
.stat.bump { animation: pop 250ms var(--ease-out); }
.list-row.is-new, .cup.is-new .icon { animation: pop 250ms var(--ease-out); }
.sheet .node-day { animation: pop 250ms var(--ease-out) both; animation-delay: calc(var(--n, 0) * 40ms); }
.chart .line { animation: draw 600ms var(--ease-out); }
.qcard.is-claiming { animation: pop 350ms var(--ease-out); }
.chest.is-ready .chest-lid { animation: nudge 900ms ease-in-out 2; }
.is-recolouring, .is-recolouring *, .is-recolouring *::before, .is-recolouring *::after {
  transition: background-color 300ms ease-out, border-color 300ms ease-out, color 300ms ease-out, fill 300ms ease-out, stroke 300ms ease-out !important;
}

@keyframes rise-in { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes scale-in { from { transform: scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slide-in { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes sink { to { transform: translateY(32px); opacity: 0; } }
@keyframes toast-in { from { transform: translate(-50%, 16px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes pop { 40% { transform: scale(1.06); } }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes hit { 30% { transform: scale(1.35) rotate(-12deg); } 60% { transform: scale(0.85) rotate(8deg); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes bob { 50% { translate: 0 -4px; } }
@keyframes lift { 50% { translate: 0 -8px; scale: 1.02; } }
@keyframes rock { 0%, 60%, 100% { rotate: 0deg; } 70% { rotate: -3deg; } 80% { rotate: 3deg; } 90% { rotate: -2deg; } }
@keyframes nudge { 30% { transform: rotate(-8deg); } 60% { transform: rotate(0); } }

/* Reduced motion: either the system asks for it or the person chose it in settings. */
:root[data-motion="reduced"] *,
:root[data-motion="reduced"] *::before,
:root[data-motion="reduced"] *::after {
  transition: none !important;
  animation: none !important;
}

@media (max-width: 440px) {
  .brand-name { display: none; }
  .card, .tile, .qface { padding: var(--sp-6) var(--sp-4); }
}

label.btn:has(+ .sr-only:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }

/* --- Recipes ------------------------------------------------------------------- */
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.chip {
  min-height: 48px;
  padding: 0 var(--sp-4);
  border: 1px solid var(--outline);
  border-radius: var(--r-pill);
  background: var(--surface-1);
  color: var(--on-surface);
  font-weight: 600;
  transition: background var(--t-micro) ease-out, transform 100ms ease-out;
}
.chip:hover { background: var(--surface-2); }
.chip:active { background: var(--surface-3); transform: scale(0.98); }
.chip[aria-checked="true"] { background: var(--tonal); color: var(--on-tonal); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.recipe { gap: var(--sp-4); }
.recipe h3 { overflow-wrap: anywhere; }
.saved-mark { display: grid; place-items: center; width: 48px; height: 48px; color: var(--accent); }

.bullets { margin: 0; padding-left: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-2); }
.bullets li::marker { color: var(--on-surface-2); }

/* A quiet callout: no card chrome, just a tonal block */
.note {
  display: flex;
  gap: var(--sp-4);
  padding: var(--sp-6);
  border-radius: var(--r-lg);
  background: var(--tonal);
  color: var(--on-tonal);
}
.note .glyph { background: var(--surface-1); color: var(--accent); }
.note-title { font-size: var(--fs-body); line-height: 1.4; font-weight: 600; }
.is-3d .note { box-shadow: 0 6px 0 var(--edge-tonal); }

/* ==========================================================================
   FatBoy Plus: gold and black replaces blue and black
   ========================================================================== */
:root[data-plan="plus"]:not([data-theme="light"]) {
  --bg: #0c0c0a; --surface-1: #151512; --surface-2: #1e1e1a; --surface-3: #282822; --outline: #2f2f28;
  --on-surface-2: #aaa89c;
  --primary: #f5c400; --primary-hover: #e0b300; --primary-press: #c99f00; --on-primary: #14110a;
  --accent: #ffd43b; --on-accent: #14110a;
  --tonal: #33290a; --tonal-hover: #3f330c; --tonal-press: #4b3d10; --on-tonal: #ffdf80;
  --sky: #ffb340;
  --glass: rgba(30, 30, 26, 0.62); --glass-active: rgba(255, 214, 0, 0.14);
  --edge-primary: #9a7500; --edge-tonal: #1f1805; --edge-accent: #b38a00; --edge-surface: #2d2d26;
}
:root[data-theme="light"][data-plan="plus"] {
  --bg: #faf8ee; --surface-2: #f1eedd; --surface-3: #e6e2cc; --outline: #ddd8bf;
  --on-surface-2: #5c5a4c;
  --primary: #ffc800; --primary-hover: #e6b400; --primary-press: #cc9f00; --on-primary: #14110a;
  --accent: #7a5600; --on-accent: #ffffff;
  --tonal: #fff0b3; --tonal-hover: #ffe88f; --tonal-press: #ffe070; --on-tonal: #4d3800;
  --sky: #8a5a00;
  --glass-active: rgba(255, 200, 0, 0.2);
  --edge-primary: #b38600; --edge-tonal: #e0cd80; --edge-accent: #4d3800; --edge-surface: #d9d4bc;
}
.plus-pill { background: var(--primary); color: var(--on-primary); font-weight: 700; }
.plus-mark { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: var(--r-md, 12px); background: var(--tonal); color: var(--on-tonal); flex: none; }
.plus-price { margin: 0; font-size: 32px; line-height: 1.2; }
.plus-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-2); }
.plus-list li { display: flex; gap: var(--sp-2); align-items: flex-start; }
.plus-list .icon { flex: none; margin-top: 2px; color: var(--accent); }

.check-box { display: inline-grid; place-items: center; width: 24px; height: 24px; flex: none; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--on-surface-2); }
.choice[aria-checked="true"] .check-box { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.check-box .icon { width: 16px; height: 16px; }

.google-mark { width: 20px; height: 20px; }
.google-mark { stroke: none; }

/* Progress photos */
.photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
.photo-thumb { aspect-ratio: 3 / 4; padding: 0; border: 0; border-radius: 12px; overflow: hidden; background: var(--surface-2); cursor: pointer; transition: transform 150ms ease; }
.photo-thumb:hover { transform: scale(1.02); }
.photo-thumb:active { transform: scale(0.98); }
.photo-thumb:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.photo-thumb img, .photo-frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
.photo-frame { margin: 0; display: grid; gap: var(--sp-2); }
.photo-frame img { height: auto; max-height: 55vh; border-radius: 12px; object-fit: contain; background: var(--surface-2); }
@media (prefers-reduced-motion: reduce) { .photo-thumb { transition: none; } }

/* Mascot tip: the logo talks, and tapping it brings another tip */
.mascot-tip { display: flex; align-items: flex-end; gap: var(--sp-3); }
.mascot { flex: none; padding: 0; border: 0; background: none; border-radius: 18px; cursor: pointer; transition: transform 150ms ease; }
.mascot:hover { transform: rotate(-4deg); }
.mascot:active { transform: scale(0.92) rotate(4deg); }
.mascot:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.mascot .logo { box-shadow: 0 2px 0 var(--outline); }
.bubble { position: relative; flex: 1; min-width: 0; padding: var(--sp-6); border-radius: 24px 24px 24px 6px; background: var(--tonal); color: var(--on-tonal); }
.bubble::before { content: ""; position: absolute; left: -7px; bottom: 14px; width: 16px; height: 16px; background: var(--tonal); border-radius: 3px; transform: rotate(45deg); }
.bubble-title { font-size: var(--fs-small); line-height: 1.4; font-weight: 600; opacity: 0.85; }
.bubble p { margin-top: var(--sp-1); }
:root[data-motion="full"] .mascot .logo { animation: bob 3.2s ease-in-out infinite; }
:root[data-motion="full"] .stat-streak.is-lit .icon { animation: flicker 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes flicker { 0%, 100% { transform: scale(1) rotate(0); } 40% { transform: scale(1.1) rotate(-5deg); } 65% { transform: scale(0.96) rotate(3deg); } }

/* Day navigation, macros, fasting */
.day-nav { gap: var(--sp-2); }
.more { border-radius: 12px; }
.more summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 600; color: var(--accent); list-style-position: inside; }
.more summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.more[open] summary { margin-bottom: var(--sp-2); }
.fast-clock { margin: 0; font-size: var(--fs-display); line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.segmented[role="tablist"] button { min-width: 0; padding-inline: var(--sp-1); font-size: var(--fs-small); }

/* ==========================================================================
   Markup helpers
   `html` escapes every interpolated value unless it is already markup, so user
   text (food names, profile name) can never inject elements.
   ========================================================================== */
class Markup {
  constructor(value) { this.value = value; }
}

const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const escapeHtml = text => String(text).replace(/[&<>"']/g, ch => ESCAPES[ch]);

function toMarkup(value) {
  if (value instanceof Markup) return value.value;
  if (Array.isArray(value)) return value.map(toMarkup).join('');
  if (value === false || value == null) return '';
  return escapeHtml(value);
}

function html(strings, ...values) {
  let out = '';
  strings.forEach((part, i) => {
    out += part + (i < values.length ? toMarkup(values[i]) : '');
  });
  return new Markup(out);
}

const pad2 = n => String(n).padStart(2, '0');
const dateKey = (date = new Date()) => `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
const today = () => dateKey();

function parseKey(key) {
  const [year, month, day] = key.split('-').map(Number);
  return new Date(year, month - 1, day);
}
const addDays = (key, days) => {
  const date = parseKey(key);
  date.setDate(date.getDate() + days);
  return dateKey(date);
};
const shortDate = key => parseKey(key).toLocaleDateString(locale(), { month: 'short', day: 'numeric' });
const longDate = key => parseKey(key).toLocaleDateString(locale(), { weekday: 'long', month: 'long', day: 'numeric' });
const weekday = key => parseKey(key).toLocaleDateString(locale(), { weekday: 'short' });

const formatInt = n => Math.round(n).toLocaleString(locale());
const formatDecimal = (n, digits = 1) =>
  n.toLocaleString(locale(), { minimumFractionDigits: digits, maximumFractionDigits: digits });
const makeId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

function hashText(text) {
  let hash = 2166136261;
  for (const char of text) hash = Math.imul(hash ^ char.charCodeAt(0), 16777619);
  return hash >>> 0;
}

function shuffle(list) {
  const copy = [...list];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function loadState() {

    if (saved) return { ...fresh, ...saved, settings: { ...fresh.settings, ...saved.settings } };
  } catch (error) { /* storage can be blocked; fall back to a fresh state */ }

}

  state.updatedAt = Date.now();

   ========================================================================== */
const ACTIVITY_FACTORS = { 1: 1.2, 2: 1.375, 3: 1.55, 4: 1.725 };

const PACES = [
  { id: 'gentle', kgPerWeek: 0.25 },
  { id: 'steady', kgPerWeek: 0.5 },
  { id: 'faster', kgPerWeek: 0.75 },
];

const KCAL_PER_KG_FAT = 7700;

// Mifflin-St Jeor estimate. Targets never go below a safe floor.
function planCalories(profile, weightKg, kgPerWeek) {
  const base = 10 * weightKg + 6.25 * profile.heightCm - 5 * profile.age;
  const bmr = base + (profile.sex === 'm' ? 5 : -161);
  // After a check-in the person's own logs can replace the formula.
  const maintenance = profile.maintenanceOverride || bmr * ACTIVITY_FACTORS[profile.activity];
  const wanted = maintenance - (kgPerWeek * KCAL_PER_KG_FAT) / 7;
  const floor = profile.sex === 'm' ? 1500 : 1200;
  return {
    maintenance: Math.round(maintenance),
    target: Math.max(floor, Math.round(wanted / 10) * 10),
    limited: wanted < floor,
    floor,
  };
}

};

const slimProgress = () => {

};

// The drawing is at its heaviest at a BMI of 36 and above, and at its leanest at 22 and below, so the
// figure follows the height and weight that were entered, not just how far along the plan is.
const BMI_HEAVY = 36;
const BMI_LEAN = 22;
const bmiOf = (kg, heightCm) => kg / Math.pow(heightCm / 100, 2);
// Someone who starts above a BMI of 36 gets a heaviest point of their own, so the first kilos they lose
// already change the drawing instead of disappearing into the flat top of the scale.
const heaviestBmi = () => (state.profile ? Math.max(BMI_HEAVY, bmiOf(state.profile.weightKg, state.profile.heightCm)) : BMI_HEAVY);
const figureProgress = (kg = currentWeightKg()) =>
  state.profile ? clamp((heaviestBmi() - bmiOf(kg, state.profile.heightCm)) / (heaviestBmi() - BMI_LEAN), 0, 1) : 0;
// The weight (and BMI) the drawing stands for at a given point of the slider.
const bmiAtFigure = progress => heaviestBmi() - progress * (heaviestBmi() - BMI_LEAN);
const weightAtFigure = progress => bmiAtFigure(progress) * Math.pow(state.profile.heightCm / 100, 2);

const lessonId = (unit, lesson) => `${unit}.${lesson}`;
const lessonsDone = () => Object.keys(state.done).length;
const unitLessonsDone = unit =>
  Array.from({ length: LESSONS_PER_UNIT }, (_, lesson) => state.done[lessonId(unit, lesson)]).filter(Boolean).length;
const isUnitDone = unit => unitLessonsDone(unit) === LESSONS_PER_UNIT;
// Index of the first lesson that is not complete (TOTAL_LESSONS when everything is done).
const firstOpenLesson = () => {
  for (let index = 0; index < TOTAL_LESSONS; index++) {
    const unit = Math.floor(index / LESSONS_PER_UNIT);
    if (!state.done[lessonId(unit, index % LESSONS_PER_UNIT)]) return index;
  }
  return TOTAL_LESSONS;
};

/* ==========================================================================
   Hearts, XP and streaks
   ========================================================================== */
const HEART_MAX = 5;
const HEART_REFILL_MS = 30 * 60 * 1000;
const REFILL_COST = 50;
const FREEZE_COST = 100;
const FREEZE_MAX = 2;

function regenerateHearts() {
  if (state.hearts >= HEART_MAX) {
    state.heartsAt = Date.now();
    return;
  }
  const earned = Math.floor((Date.now() - state.heartsAt) / HEART_REFILL_MS);
  if (earned <= 0) return;
  state.hearts = Math.min(HEART_MAX, state.hearts + earned);
  state.heartsAt = state.hearts >= HEART_MAX ? Date.now() : state.heartsAt + earned * HEART_REFILL_MS;
  saveState();
}

const PLUS_PRICE = 3.99;
const FREE_AI_PER_DAY = 2;
const aiLeftToday = () => Math.max(0, FREE_AI_PER_DAY - (state.aiUsed[today()] || 0));

function loseHeart() {
  if (state.plus) return;
  if (state.hearts === HEART_MAX) state.heartsAt = Date.now();
  state.hearts = Math.max(0, state.hearts - 1);
  saveState();
}

const isActiveDay = key => (state.days[key] || 0) > 0 || state.frozen.includes(key);

function currentStreak() {
  let key = today();
  if (!isActiveDay(key)) key = addDays(key, -1);
  let count = 0;
  while (isActiveDay(key) && count < 3650) {
    count++;
    key = addDays(key, -1);
  }
  return count;
}

// Spend freezes to bridge missed days, but only when there are enough to cover the whole gap.
function protectStreak() {
  const current = today();
  if (isActiveDay(current)) return;

  let lastActive = null;
  for (let key = addDays(current, -1), i = 0; i < 400; key = addDays(key, -1), i++) {
    if (isActiveDay(key)) { lastActive = key; break; }
  }
  if (!lastActive) return;

  const missed = [];
  for (let key = addDays(lastActive, 1); key < current; key = addDays(key, 1)) missed.push(key);
  if (missed.length && missed.length <= state.freezes) {
    state.freezes -= missed.length;
    state.frozen.push(...missed);
    saveState();
  }
}

function grantXp(xp, gems = 0) {
  state.days[today()] = xpToday() + xp;
  state.xp += xp;
  state.gems += gems;
  state.best = Math.max(state.best, currentStreak());
  saveState();
}

// Small first-time-each-day XP so logging alone keeps a streak alive.
function grantDailyBonus(kind, xp) {
  state.flags.bonus = state.flags.bonus || {};
  const key = today() + kind;
  if (state.flags.bonus[key]) return;
  state.flags.bonus[key] = 1;
  grantXp(xp);
}

/* ==========================================================================
   The FatBoy figure
   The logo is a vector trace (see figure-data.js). `figureShape` warps it:
   at progress 0 it is the original drawing, at 1 the lean version at goal weight.
   `main(p)` and `soft(p)` are SVG path data; the soft strokes fade out (`softOpacity(p)`).
   ========================================================================== */
const figureShape = (() => {
  const { y0, step, front, back, contours } = FIGURE_DATA;
  const MAX_PIECE = 20; // curves longer than this are split so the warp follows them closely

  const lerp = (a, b, t) => a + (b - a) * t;

  // A straight line as a cubic whose control points sit a third of the way along it.
  const line = (from, to) => [
    lerp(from[0], to[0], 1 / 3), lerp(from[1], to[1], 1 / 3),
    lerp(from[0], to[0], 2 / 3), lerp(from[1], to[1], 2 / 3),
    to[0], to[1],
  ];

  // Every traced segment becomes cubics [x1, y1, x2, y2, x3, y3], so there is one case to handle.
  function toCubics(from, seg) {
    if (seg.length === 6) return [seg];
    // A corner segment is two straight lines: from -> corner -> end.
    const corner = [seg[0], seg[1]];
    return [line(from, corner), line(corner, [seg[2], seg[3]])];
  }

  // Cut a cubic into `count` pieces that together trace the same curve.
  function subdivide(from, [x1, y1, x2, y2, x3, y3], count) {
    const at = t => {
      const u = 1 - t;
      return [
        u * u * u * from[0] + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3,
        u * u * u * from[1] + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3,
      ];
    };
    const slope = t => {
      const u = 1 - t;
      return [
        3 * (u * u * (x1 - from[0]) + 2 * u * t * (x2 - x1) + t * t * (x3 - x2)),
        3 * (u * u * (y1 - from[1]) + 2 * u * t * (y2 - y1) + t * t * (y3 - y2)),
      ];
    };
    const pieces = [];
    for (let i = 0; i < count; i++) {
      const t0 = i / count;
      const t1 = (i + 1) / count;
      const a = at(t0), b = at(t1), da = slope(t0), db = slope(t1);
      const k = (t1 - t0) / 3;
      pieces.push([a[0] + da[0] * k, a[1] + da[1] * k, b[0] - db[0] * k, b[1] - db[1] * k, b[0], b[1]]);
    }
    return pieces;
  }

  // Strokes that read as sagging fat (the fold under the chest, the neck fold) fade out as the figure slims.
  const SOFT = new Set([5, 10]);

  const shapes = contours.map(({ start, segs }, index) => {
    const pieces = [];
    let from = start;
    for (const seg of segs) {
      for (const cubic of toCubics(from, seg)) {
        const reach = Math.hypot(cubic[4] - from[0], cubic[5] - from[1]);
        pieces.push(...subdivide(from, cubic, Math.max(1, Math.ceil(reach / MAX_PIECE))));
        from = [cubic[4], cubic[5]];
      }
    }
    return { start, pieces, soft: SOFT.has(index) };
  });

  const sample = (table, y) => {
    const position = clamp((y - y0) / step, 0, table.length - 1);
    const low = Math.floor(position);
    const high = Math.min(table.length - 1, low + 1);
    return table[low] + (table[high] - table[low]) * (position - low);
  };

  // Where the front of the body sits when lean: a neck that drops straight into a modest chest, a flat
  // stomach, then the belt and legs return to the original drawing. Each pair is [y, x].
  const LEAN_FRONT = [
    [330, sample(front, 330)], [360, 492], [390, 476], [420, 460], [450, 446], [480, 438], [520, 436],
    [560, 438], [620, 442], [700, 446], [780, 442], [840, 424], [900, 396], [960, 392], [1000, sample(front, 1000)],
  ];
  const leanFront = y => {
    const next = Math.max(1, LEAN_FRONT.findIndex(([keyY]) => keyY >= y));
    const [y1, x1] = LEAN_FRONT[next - 1];
    const [y2, x2] = LEAN_FRONT[next];
    return x1 + ((x2 - x1) * clamp(y - y1, 0, y2 - y1)) / (y2 - y1);
  };

  // How far the back is pulled in at each height: no shoulder hump, a flat upper back, a trim waist.
  const BACK_TRIM = [[330, 0], [360, 12], [390, 26], [420, 36], [450, 42], [480, 44], [520, 44], [570, 38], [620, 30], [700, 22], [760, 14], [820, 6], [870, 0]];
  const trimAt = y => {
    const next = BACK_TRIM.findIndex(([keyY]) => keyY >= y);
    if (next <= 0) return 0;
    const [y1, t1] = BACK_TRIM[next - 1];
    const [y2, t2] = BACK_TRIM[next];
    return t1 + ((t2 - t1) * (y - y1)) / (y2 - y1);
  };

    const t = clamp((value - from) / (to - from), 0, 1);
    return t * t * (3 - 2 * t);

  // The jaw line and the front of the neck are lifted so the chin sits on a clean angle, with no second chin.
  const jawLift = (x, y) =>
    54 * smooth(462, 548, x) * (1 - smooth(585, 640, x)) * smooth(270, 300, y) * (1 - smooth(335, 410, y));

  // The drawing has a second curve under the chin. Everything between the chin line and that curve is
  // squashed flat onto the chin line, so the jaw reads as one clean line (jawLift takes over toward the neck).
  const CHIN_LINE = 284;

    clamp(y - CHIN_LINE, 0, 32) * smooth(430, 485, x) * (1 - smooth(500, 560, x)) * (1 - smooth(335, 410, y));
  const faceLift = (x, y) => Math.max(jawLift(x, y), chinTuck(x, y));

  const faceAmount = progress => clamp(progress * 4, 0, 1);

  // Rows below the neck are re-spaced between the front and back outlines, so the
  // belly, arm and belt keep their shape while the whole torso gets slimmer.
  function warp(x, y, progress) {
    if (y > y0) {
      const front0 = sample(front, y);
      const back0 = sample(back, y);
      const front1 = front0 + (leanFront(y) - front0) * progress;
      const back1 = back0 + (leanBack(y) - back0) * progress;

    }
    // A slimmer face: pull the jaw and cheeks slightly toward the centre line.
    const jaw = Math.max(0, 1 - Math.abs(y - 250) / 100);
    const centre = 570;
    return [centre + (x - centre) * (1 - 0.07 * progress * jaw), y - faceLift(x, y) * faceAmount(progress)];

    const point = (x, y) => warp(x, y, progress).map(round).join(' ');
    return shapes.filter(({ soft }) => soft === wantSoft).map(({ start, pieces }) => {
      const curves = pieces.map(p => `C${point(p[0], p[1])} ${point(p[2], p[3])} ${point(p[4], p[5])}`);
      return `M${point(start[0], start[1])}${curves.join('')}Z`;
    }).join('');
  };

  // Where the jaw meets the ear. The traced drawing leaves the jawline hanging in the air once it is
  // lifted, so a short stroke carries it round the angle of the jaw and up the ramus to the earlobe.
  const EAR_FOOT = [576, 243];
  const JAW_END = [552, 310];
  const HALF_WIDTH = 2.2;
  const ramus = progress => {
    const amount = faceAmount(progress);
    if (amount < 0.05) return '';
    const e = warp(JAW_END[0], JAW_END[1], progress);
    const top = [e[0] + (EAR_FOOT[0] - e[0]) * amount, e[1] + (EAR_FOOT[1] - e[1]) * amount];
    const c1 = [e[0] + 12, e[1] + 2 * amount];
    const c2 = [top[0] - 1, top[1] + 15 * amount];
    const at = t => {
      const u = 1 - t;
      return [0, 1].map(i => u * u * u * e[i] + 3 * u * u * t * c1[i] + 3 * u * t * t * c2[i] + t * t * t * top[i]);
    };
    const left = [];
    const right = [];
    const steps = 16;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const [x, y] = at(t);
      const [x2, y2] = at(Math.min(1, t + 0.02));
      const [x1, y1] = at(Math.max(0, t - 0.02));
      const length = Math.hypot(x2 - x1, y2 - y1) || 1;
      const nx = -(y2 - y1) / length;
      const ny = (x2 - x1) / length;
      left.push([x + nx * HALF_WIDTH, y + ny * HALF_WIDTH]);
      right.push([x - nx * HALF_WIDTH, y - ny * HALF_WIDTH]);
    }
    const points = left.concat(right.reverse()).map(([x, y]) => `${round(x)} ${round(y)}`);
    return `M${points[0]}L${points.slice(1).join('L')}Z`;
  };

  return {
    main: progress => outline(progress, false) + ramus(progress),
    soft: progress => outline(progress, true),
    softOpacity: progress => clamp(1 - progress * 1.6, 0, 1),
  };
})();

const weekStart = () => {
  const mondayOffset = (parseKey(today()).getDay() + 6) % 7;
  return addDays(today(), -mondayOffset);
};
const weekDays = () => Array.from({ length: 7 }, (_, i) => addDays(weekStart(), i));

const weighedThisWeek = () =>
  Object.keys(state.weights).some(key => key >= weekStart() && key !== state.profile.start);

  { id: 'active5', icon: 'flame', goal: 5, gems: 30, xp: 25, weekly: true, progress: activeDaysThisWeek },

const dailyQuests = () => TIERS.map(tier => {
  const pool = QUEST_POOL.filter(quest => quest.tier === tier);

});

const claimKey = quest => (quest.weekly ? `week:${weekStart()}:${quest.id}` : `${today()}:${quest.id}`);
const dayKey = quest => `${today()}:${quest.id}`;
const isClaimed = quest => Boolean(state.claimed[claimKey(quest)]);
const questProgress = quest => (quest.self ? Number(Boolean(state.checks[dayKey(quest)])) : quest.progress());
const isQuestDone = quest => questProgress(quest) >= quest.goal;
const isRevealed = quest => Boolean(state.revealed[dayKey(quest)]) || questProgress(quest) > 0 || isClaimed(quest);
const questById = id => [...QUEST_POOL, ...WEEKLY_QUESTS].find(quest => quest.id === id);

  if (isClaimed(quest) || !isQuestDone(quest)) return false;
  state.claimed[claimKey(quest)] = 1;

}

  if (!isChestReady()) return null;

/* ==========================================================================
   Appearance and motion settings
   The resolved theme and motion are written to <html> as data attributes; the
   stylesheet only ever looks at those.
   ========================================================================== */
const systemLight = matchMedia('(prefers-color-scheme: light)');
const systemReduced = matchMedia('(prefers-reduced-motion: reduce)');

const resolvedTheme = () => {
  const { theme } = state.settings;
  if (theme !== 'system') return theme;
  return systemLight.matches ? 'light' : 'dark';
};

const motionOn = () => {
  const { motion } = state.settings;
  return motion === 'full' || (motion === 'auto' && !systemReduced.matches);
};

function applySettings() {
  const root = document.documentElement;
  root.dataset.theme = resolvedTheme();
  root.dataset.plan = state.plus ? 'plus' : 'free';
  root.dataset.motion = motionOn() ? 'full' : 'reduced';
  root.lang = state.settings.language;
}

// Fade colours between themes instead of snapping.
function applyThemeChange() {
  const root = document.documentElement;
  if (motionOn()) {
    root.classList.add('is-recolouring');
    setTimeout(() => root.classList.remove('is-recolouring'), 350);
  }
  applySettings();
}

systemLight.addEventListener('change', applySettings);
systemReduced.addEventListener('change', applySettings);

// Run `callback` after the animation has had time to play (straight away when motion is off).
// A short buzz on phones that support it, so taps feel like something happened.
const buzz = pattern => { if (motionOn()) navigator.vibrate?.(pattern); };

const afterMotion = (callback, ms) => setTimeout(callback, motionOn() ? ms : 0);

/* ==========================================================================
   Tweens
   Screens are repainted from scratch, so meters and counters remember their
   previous value (by key) and play from it to the new one.
   ========================================================================== */
const fraction = value => clamp(value, 0, 1).toFixed(3);

function snapshotTweens(root) {
  const bars = new Map($$('[data-tween]', root).map(el => [el.dataset.tween, el.style.getPropertyValue('--v')]));
  const counts = new Map($$('[data-key]', root).map(el => [el.dataset.key, Number(el.dataset.count)]));
  return { bars, counts };
}

function playTweens(root, previous, entering) {
  const jobs = [];
  for (const el of $$('[data-tween]', root)) {
    const to = el.style.getPropertyValue('--v');
    const from = previous.bars.has(el.dataset.tween) ? previous.bars.get(el.dataset.tween) : entering ? '0.000' : to;
    if (from !== to) {
      el.style.setProperty('--v', from);
      jobs.push([el, to]);
    }
  }
  if (jobs.length) {
    void root.offsetWidth; // commit the starting values so the change transitions
    for (const [el, to] of jobs) el.style.setProperty('--v', to);
  }

  for (const el of $$('[data-count]', root)) {
    const to = Number(el.dataset.count);
    const known = el.dataset.key && previous.counts.has(el.dataset.key);
    const from = known ? previous.counts.get(el.dataset.key) : entering ? 0 : to;
    if (from === to) continue;
    const stat = el.closest('.stat');
    if (stat && known) {
      stat.classList.remove('bump');
      void stat.offsetWidth;
      stat.classList.add('bump');
    }
    countUp(el, from, to);
  }
}

function countUp(el, from, to, duration = 600) {
  if (!motionOn()) return;
  const start = performance.now();
  const step = now => {
    const progress = clamp((now - start) / duration, 0, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = formatInt(from + (to - from) * eased);
    if (progress < 1 && el.isConnected) requestAnimationFrame(step);
  };
  el.textContent = formatInt(from);
  requestAnimationFrame(step);
}

/* ==========================================================================
   Confetti: a short burst of small pieces from a point on screen
   ========================================================================== */
function burst(x, y, { count = 30, spread = 200 } = {}) {
  if (!motionOn()) return;
  const layer = $('#fx');
  const colours = ['var(--accent)', 'var(--sky)', 'var(--success)', 'var(--on-tonal)', 'var(--primary)'];
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('i');
    piece.className = 'confetti';
    piece.style.background = colours[i % colours.length];
    piece.style.left = `${x}px`;
    piece.style.top = `${y}px`;
    if (i % 3 === 0) piece.style.borderRadius = '50%';
    layer.append(piece);

    const angle = Math.random() * Math.PI * 2;
    const power = spread * (0.4 + Math.random() * 0.6);
    const dx = Math.cos(angle) * power;
    const dy = Math.sin(angle) * power - 80;
    const spin = (Math.random() - 0.5) * 720;
    const flight = piece.animate([
      { transform: 'translate(0, 0) rotate(0deg) scale(1)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px) rotate(${spin / 2}deg) scale(1)`, opacity: 1, offset: 0.45 },
      { transform: `translate(${dx * 1.15}px, ${dy + 260}px) rotate(${spin}deg) scale(0.6)`, opacity: 0 },
    ], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(0.2, 0, 0, 1)' });
    flight.onfinish = () => piece.remove();
  }
}

const burstFrom = el => {
  const box = el.getBoundingClientRect();
  burst(box.left + box.width / 2, box.top + box.height / 2);
};

/* ==========================================================================
   The figure
   Two shared paths hold the outline (the strokes that stay, and the soft ones that fade); every <use> redraws when they change.
   `figure.shown` is how slim it looks right now, `figure.target` how slim it should be.
   ========================================================================== */
const figure = { shown: 0, target: 0, frame: 0 };

function drawFigure(progress) {
  figure.shown = progress;
  $('#fb-figure').setAttribute('d', figureShape.main(progress));
  const soft = $('#fb-figure-soft');
  soft.setAttribute('d', figureShape.soft(progress));
  soft.setAttribute('opacity', figureShape.softOpacity(progress).toFixed(2));
}

function tweenFigure(to, duration = 1200) {
  cancelAnimationFrame(figure.frame);
  const from = figure.shown;
  if (!motionOn() || duration === 0 || from === to) {
    drawFigure(to);
    return Promise.resolve();
  }
  const start = performance.now();
  return new Promise(resolve => {
    const step = now => {
      const progress = clamp((now - start) / duration, 0, 1);
      const eased = progress < 0.5 ? 4 * progress ** 3 : 1 - Math.pow(-2 * progress + 2, 3) / 2;
      drawFigure(from + (to - from) * eased);
      if (progress < 1) figure.frame = requestAnimationFrame(step);
      else resolve();
    };
    figure.frame = requestAnimationFrame(step);
  });
}

// Called after every repaint: if the weight changed, the figure slims (or fills out) to match its BMI.
function syncFigure() {
  const target = figureProgress();
  if (target === figure.target) return;
  figure.target = target;
  tweenFigure(target).then(() => {
    state.flags.figureShown = target;
    saveState();
  });
}

  await new Promise(resolve => setTimeout(resolve, 700));
  if (!$('.hero')) return;
  await tweenFigure(1, 1800);
  await new Promise(resolve => setTimeout(resolve, 900));
  if (!$('.hero')) return;
  await tweenFigure(figure.target, 1400);
}

const RING_RADII = [88, 66, 44];

function activityRings(rings) {
  const layers = rings.map(({ key, value, color }, i) => {
    const radius = RING_RADII[i];
    const length = 2 * Math.PI * radius;
    return html`
      <circle class="ring-track" cx="100" cy="100" r="${radius}"/>
      <circle class="ring-fill" cx="100" cy="100" r="${radius}" stroke="${color}" data-tween="${key}" style="--v:${fraction(value)};--len:${length.toFixed(1)}"/>`;
  });
  return html`<svg class="rings" viewBox="0 0 200 200" role="img" aria-label="${t('track.ringsLabel')}">${layers}</svg>`;
}

function weightChart() {
  const dates = Object.keys(state.weights).sort().slice(-30);
  if (dates.length < 2) return html`<p class="caption">${t('weight.needTwo')}</p>`;

  const values = dates.map(date => mass.fromKg(state.weights[date]));
  const goal = mass.fromKg(state.profile.goalKg);
  const low = Math.floor(Math.min(...values, goal) - 1);
  const high = Math.ceil(Math.max(...values, goal) + 1);

  const width = 320, height = 176;
  const pad = { left: 48, right: 16, top: 16, bottom: 32 };
  const days = dates.map(date => parseKey(date).getTime() / 864e5);
  const spanDays = (days[days.length - 1] - days[0]) || 1;
  const x = day => pad.left + ((day - days[0]) / spanDays) * (width - pad.left - pad.right);
  const y = value => pad.top + ((high - value) / (high - low)) * (height - pad.top - pad.bottom);
  const points = values.map((value, i) => [x(days[i]), y(value)]);
  const ticks = [0, 1, 2, 3].map(i => low + ((high - low) * i) / 3);
  const f = n => n.toFixed(1);

  return html`
    <div class="scroll-x">
      <svg class="chart" viewBox="0 0 ${width} ${height}" role="img"
           aria-label="${t('weight.chartLabel', { from: formatDecimal(values[0]), to: formatDecimal(values[values.length - 1]), unit: mass.unit(), goal: formatDecimal(goal) })}">
        ${ticks.map(tick => html`
          <line class="grid" x1="${pad.left}" x2="${width - pad.right}" y1="${f(y(tick))}" y2="${f(y(tick))}"/>
          <text x="${pad.left - 8}" y="${f(y(tick) + 4)}" text-anchor="end">${formatDecimal(tick)}</text>`)}
        <line class="goal" x1="${pad.left}" x2="${width - pad.right}" y1="${f(y(goal))}" y2="${f(y(goal))}"/>
        <text x="${width - pad.right}" y="${f(y(goal) - 8)}" text-anchor="end" style="fill:var(--sky)">${t('weight.goal')}</text>
        <polyline class="line" pathLength="1" points="${points.map(p => `${f(p[0])},${f(p[1])}`).join(' ')}"/>
        ${points.map(p => html`<circle class="dot" cx="${f(p[0])}" cy="${f(p[1])}" r="4"/>`)}
        <text x="${pad.left}" y="${height - 8}">${shortDate(dates[0])}</text>
        <text x="${width - pad.right}" y="${height - 8}" text-anchor="end">${shortDate(dates[dates.length - 1])}</text>
      </svg>
    </div>`;
}

function questActions(quest, done, claimed) {
  if (claimed) return html`<span class="stamp">${icon('check')}${t('quests.claimed')}</span>`;
  if (done) {
    return html`
      <div class="row row-wrap">
        <button class="btn btn-tonal" data-action="claim-quest" data-id="${quest.id}">${icon('sparkle')}${t('quests.claim')}</button>
        ${quest.self ? html`<button class="btn btn-plain" data-action="toggle-check" data-id="${quest.id}">${t('quests.undo')}</button>` : ''}
      </div>`;
  }
  if (quest.self) {
    return html`<button class="btn btn-tonal" data-action="toggle-check" data-id="${quest.id}">${icon('check')}${t('quests.markDone')}</button>`;
  }
  // Secret quests do not say where to go until they are done.
  if (quest.tier === 'secret') return '';
  return html`<button class="btn btn-plain" data-action="quest-go" data-id="${quest.id}">${t('quests.go')}${icon('next')}</button>`;
}

// A two-sided card. The back is shown until the quest is turned over (or has started).
function questCard(quest, index) {
  const done = isQuestDone(quest);
  const claimed = isClaimed(quest);
  const flipped = isRevealed(quest);
  const progress = Math.min(questProgress(quest), quest.goal);
  const hidden = quest.tier === 'secret' && !done && !claimed;

  let caption = t('quests.progress', { n: progress, goal: quest.goal });
  if (hidden) caption = t('quests.secretCaption');
  else if (quest.self) caption = done ? t('quests.checked') : t('quests.selfPrompt');

  return html`
    <div class="qcard ${flipped ? 'is-flipped' : ''}" data-quest="${quest.id}" style="--n:${index}">
      <div class="qcard-inner">
        <button class="qface qback" data-tilt="3" data-action="flip-quest" data-id="${quest.id}" ${attributes({ inert: flipped })}>
          <span class="qmark">${icon(quest.tier === 'secret' ? 'sparkle' : 'question')}</span>
          <span class="stack-tight grow">
            <span class="qtier">${t(`tier.${quest.tier}`)}</span>
            <span class="caption">${t('quests.tapReveal')}</span>
            ${tierPips(quest.tier)}
          </span>
          <span class="pill is-tonal">${icon('gem')}${quest.gems}</span>
        </button>
        <div class="qface qfront" ${attributes({ inert: !flipped })}>
          <div class="row">
            <span class="glyph">${icon(quest.icon)}</span>
            <div class="grow">
              <h3>${hidden ? t(`quest.${quest.id}.hint`) : t(`quest.${quest.id}.title`)}</h3>
              <p class="caption num">${hidden ? caption : `${t(`tier.${quest.tier}`)}. ${caption}`}</p>
            </div>
            <span class="pill is-tonal">${icon('gem')}${quest.gems}</span>
          </div>
          ${quest.self || hidden ? '' : progressBar(t(`quest.${quest.id}.title`), `q-${quest.id}`, progress, quest.goal)}
          ${questActions(quest, done, claimed)}
        </div>
      </div>
    </div>`;
}

const newDraft = () => ({
  step: 0, name: '', sex: '', age: '', units: state.units,
  height: '', feet: '', inches: '', weight: '', goal: '', activity: 2, pace: 0.5, agree: false,
});

const draftHeightCm = draft =>
  draft.units === 'metric' ? Number(draft.height) : (Number(draft.feet) * 12 + (Number(draft.inches) || 0)) * 2.54;
const draftToKg = (value, units) => (units === 'metric' ? Number(value) : Number(value) / LB_PER_KG);

function draftProfile() {
  const d = ui.draft;
  return {
    name: d.name.trim(), sex: d.sex, age: Number(d.age),
    heightCm: Math.round(draftHeightCm(d) * 10) / 10,
    weightKg: draftToKg(d.weight, d.units), goalKg: draftToKg(d.goal, d.units),
    activity: Number(d.activity), pace: Number(d.pace), start: today(),
  };
}

function validateDraft(step) {
  const d = ui.draft;
  const errors = {};
  if (step === 1) {
    if (!d.name.trim()) errors.name = t('error.name');
    if (!d.sex) errors.sex = t('error.sex');
    const age = Number(d.age);
    if (!(age >= 18 && age <= 99)) errors.age = age && age < 18 ? t('error.adults') : t('error.age');
    if (!(draftHeightCm(d) >= 120 && draftHeightCm(d) <= 230)) errors.height = t('error.height');
    if (!d.agree) errors.agree = t('error.agree');
  }
  if (step === 2) {
    const weight = draftToKg(d.weight, d.units);
    const goal = draftToKg(d.goal, d.units);
    const lowest = lowestHealthyKg(draftHeightCm(d));
    const unit = d.units === 'metric' ? 'kg' : 'lb';
    if (!(weight >= 40 && weight <= 250)) errors.weight = t('error.weight');
    if (!(goal > 0)) errors.goal = t('error.goalMissing');
    else if (weight && goal >= weight) errors.goal = t('error.goalHigher');
    else if (goal < lowest) errors.goal = t('error.goalLow', { n: formatDecimal(d.units === 'metric' ? lowest : lowest * LB_PER_KG), unit });
  }
  return errors;
}

function textField({ id, label, field, type = 'text', value, error, extra = {} }) {
  return html`
    <div class="field">
      <label for="${id}">${label}</label>
      <input ${attributes({ class: 'input', id, type, value, 'data-field': field, 'aria-invalid': error ? 'true' : null, 'aria-describedby': error ? `${id}-error` : null, ...extra })}>
      ${errorLine(`${id}-error`, error)}
    </div>`;
}

const draftChoice = ({ id, label, field, options, value, error }) =>
  segmented({ id, label, action: 'set-draft', field, options, value, error });

function onboardingStep(title, subtitle, body, nextLabel) {
  const { step } = ui.draft;
  return html`
    <div class="container">
      <div class="page is-entering">
        <div class="row">
          <button class="btn btn-plain" data-action="draft-back">${icon('back')}${t('nav.back')}</button>
